title: dpx_piprepper
description: cardbless - prep a stack of CompanionPi SD cards
# Theme is self-hosted locally (_layouts/, _sass/dpx-midnight.scss,
# assets/css/style.scss) instead of via `remote_theme`/`theme` -- no gem
# dependency, no third-party attribution banner rendered on the page. See
# _sass/dpx-midnight.scss for the credit/license note on where it came from.
markdown: kramdown
kramdown:
  parse_block_html: true
  typographic_syms:
    ndash: '--'
    mdash: '---'
    laquo_space: '<< '
    raquo_space: ' >>'
    laquo: '<<'
    raquo: '>>'
    hellip: '...'

